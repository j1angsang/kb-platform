[project]
name = "kb-platform"
version = "0.1.0"
description = "企业知识库平台：文件存储底座 + 审核流 + 多模态检索 + 对话式问答"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "cryptography>=49.0.0",
    "dashscope>=1.27.4",
    "fastapi>=0.139.2",
    "langchain>=1.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "minio>=7.2.0",
    "onnxruntime>=1.30.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.5",
    "pypdf>=6.17.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "rapidocr[onnxruntime]>=3.9.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sqlglot>=25.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
